[pytest]
testpaths = tests
asyncio_mode = auto

# Tests that need a live, seeded Supabase are marked `requires_db` and are
# deselected by default, so a plain `pytest` run is hermetic: no credentials,
# no network, no shared-database collisions between two people running at once.
#
#   pytest                  -> the hermetic suite (default)
#   pytest -m requires_db   -> only the live-database tests
#   pytest -m ""            -> everything
#
# A `-m` passed on the command line overrides the one below, since addopts are
# prepended and the last -m wins.
addopts = -m "not requires_db"

markers =
    requires_db: needs a live, seeded Supabase instance (deselected by default)
